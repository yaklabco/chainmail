syntax = "proto3";

package chainmail.v1;

import "chainmail/v1/message.proto";
import "google/protobuf/timestamp.proto";

// AuthState says whether chainmail can log in to an account without a human.
enum AuthState {
  AUTH_STATE_UNSPECIFIED = 0;
  // Credentials are present and have not been rejected.
  AUTH_STATE_OK = 1;
  // Credentials are missing or were rejected. auth_detail says what to run.
  AUTH_STATE_REQUIRED = 2;
}

// Account is one configured mail account.
message Account {
  string name = 1;
  string provider = 2;
  string address = 3;
  // "password" or "oauth2".
  string auth_method = 4;
  AuthState auth_state = 5;
  // Why auth is required, and what to run, when auth_state is AUTH_STATE_REQUIRED.
  string auth_detail = 6;
}

message ListAccountsRequest {}

message ListAccountsResponse {
  repeated Account accounts = 1;
}

message TestAccountRequest {
  string account = 1;
}

// Check is the result of one connection test.
message Check {
  bool ok = 1;
  // Stable reason when ok is false: AUTH_REJECTED, SERVER_UNAVAILABLE or TIMEOUT.
  string reason = 2;
  string error = 3;
  // IMAP capabilities, when the IMAP login worked.
  repeated string capabilities = 4;
  int64 latency_ms = 5;
}

message TestAccountResponse {
  string account = 1;
  Check imap = 2;
  Check smtp = 3;
}

// ProbeLimitsRequest measures how many IMAP connections accounts allow.
message ProbeLimitsRequest {
  // Accounts to probe. Empty means every account. An unknown or invalid
  // name fails the whole call before any probe runs.
  repeated string accounts = 1;
}

// AccountLimit is the probe result for one account.
message AccountLimit {
  // The account probed.
  string account = 1;
  // Connections the server allowed at once: the probe's own, plus those the
  // daemon already had open to the account. 0 when error is set.
  uint32 imap_cap = 2;
  // Connections the daemon now uses: pool from config, or imap_cap less 2,
  // between 1 and 12.
  uint32 pool_size = 3;
  // When the probe ran.
  google.protobuf.Timestamp probed_at = 4;
  // Set when the probe failed, such as when the first connection was refused.
  ItemError error = 5;
}

// ProbeLimitsResponse has one result per account probed.
message ProbeLimitsResponse {
  // One per account, in the order asked, or by name for every account.
  repeated AccountLimit limits = 1;
}

// AccountService describes configured accounts, tests their connections and
// measures their connection limits.
service AccountService {
  // ListAccounts returns every configured account and its auth state.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  // TestAccount logs in to the account's IMAP and SMTP servers and reports what happened.
  rpc TestAccount(TestAccountRequest) returns (TestAccountResponse);
  // ProbeLimits opens connections one at a time until the server refuses
  // one or 16 are open, then sets the pool size from the count.
  rpc ProbeLimits(ProbeLimitsRequest) returns (ProbeLimitsResponse);
}
