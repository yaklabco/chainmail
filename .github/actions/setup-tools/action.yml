name: Set up the build tools
description: >-
  Installs Go, buf, golangci-lint and goreleaser at the versions CI pins.
  Every stave target checks for all four before it runs. The ci and release
  workflows both use this action, so a pull request runs the same setup a
  release does.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
    - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
      with:
        # Pinned so a new buf lint rule cannot fail a release. The same
        # version the Nix dev shell gives local runs.
        version: 1.73.0
        setup_only: true
    - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.15.0
        install-only: true
    # The same goreleaser version the Nix dev shell gives local runs.
    - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        distribution: goreleaser
        version: v2.17.1
        install-only: true
