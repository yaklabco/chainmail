name: release
# Cuts a release: the next version from the commits since the last tag, its
# notes from that version's CHANGELOG.md section. Run it from main once the
# changelog for the version is merged.
on:
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    # Releases are cut from main only. A dispatch from another branch stops
    # here, before any step runs with the token.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # goreleaser's --parallelism. Without it a 4-core runner gets 1.
      STAVE_NUM_PROCESSORS: "2"
    steps:
      - name: Require the Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set. Add a token that can push to yaklabco/homebrew-tap with: gh secret set HOMEBREW_TAP_TOKEN --repo yaklabco/chainmail"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
      # The same tool setup the ci workflow runs on every pull request.
      - uses: ./.github/actions/setup-tools
      - name: Configure git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: go tool stave check
      - run: go tool stave release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
