name: ci
env:
  HOMEBREW_NO_ANALYTICS: "1"
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-tools
      - run: go tool stave check
      # chainmail runs on any Linux and on macOS, so a build that works on
      # only one of them fails here.
      - name: cross-build
        env:
          CGO_ENABLED: "0"
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            echo "building for $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done
  macos:
    # The unit tests on macOS, with the tools from the Brewfile, so the
    # Homebrew setup for contributors is tested here. The Dovecot tests need
    # Docker, so they stay in the integration job on Linux; their
    # integration build tag keeps them out of this run, as the live tag
    # keeps out the live tests. Lint runs in the check job, at the pinned
    # golangci-lint, because Homebrew's version is not pinned.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: brew bundle check --file=Brewfile || brew bundle install --file=Brewfile
      - name: Require the tools to come from Homebrew
        run: |
          prefix=$(brew --prefix)
          for tool in go buf golangci-lint goreleaser; do
            path=$(command -v "$tool") || { echo "::error::$tool is not on PATH"; exit 1; }
            case $path in
              "$prefix"/*) echo "$tool: $path" ;;
              *) echo "::error::$tool is $path, not from Homebrew"; exit 1 ;;
            esac
          done
      - run: go tool stave prereq
      - run: go tool stave build
      - run: go test -short -race -p 2 ./...
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-tools
      - run: go tool stave test:integration
  nix:
    # Builds the flake's package, so a vendorHash that go.mod or go.sum has
    # made stale fails here and not for someone installing from the flake.
    # Then runs the full check in the dev shell with no Homebrew on PATH, as
    # a contributor who uses Nix does.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The ubuntu image has Homebrew installed but not on PATH. This job
      # tests the setup without it, so fail if that ever changes.
      - name: Require no Homebrew on PATH
        run: |
          if command -v brew; then
            echo "::error::brew is on PATH, so this job does not test a Nix-only setup"
            exit 1
          fi
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix build .#default --print-build-logs
      - name: Require the tools to come from the dev shell
        shell: nix develop -c bash -e {0}
        run: |
          for tool in go buf golangci-lint goreleaser; do
            path=$(command -v "$tool") || { echo "::error::$tool is not on PATH"; exit 1; }
            case $path in
              /nix/store/*) echo "$tool: $path" ;;
              *) echo "::error::$tool is $path, not from the dev shell"; exit 1 ;;
            esac
          done
      - run: nix develop -c go tool stave check
  release-config:
    # Checks the goreleaser config and builds the release archives and the
    # Cask into dist/ without publishing, so a broken release config fails
    # before release day.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # goreleaser's --parallelism. Without it a 4-core runner gets 1.
      STAVE_NUM_PROCESSORS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The next version comes from the commits since the last tag.
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-tools
      - run: goreleaser check
      - run: go tool stave snapshot
  docs:
    # Checks every shell block in the README parses in the shells it is
    # written for. The manual lives in yaklabco/chainmail.sh, which runs
    # the same check on its pages.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y fish
      - run: scripts/check-doc-shell_test.sh
      - run: scripts/check-doc-shell.sh README.md
  workflows:
    # Lints the workflows and the setup action, including the shell in their
    # run steps, which shellcheck on the runner image checks.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
