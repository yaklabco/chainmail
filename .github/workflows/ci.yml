name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - run: go tool stave check
      # chainmail runs on any Linux and on macOS, so a build that works on
      # only one of them fails here.
      - name: cross-build
        env:
          CGO_ENABLED: "0"
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            echo "building for $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done
  macos:
    # The unit tests on macOS. The Dovecot tests need Docker, so they stay
    # in the integration job on Linux; their integration build tag keeps
    # them out of this run, as the live tag keeps out the live tests.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -short -race -p 2 ./...
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go tool stave test:integration
  nix:
    # Builds the flake's package, so a vendorHash that go.mod or go.sum has
    # made stale fails here and not for someone installing from the flake.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.11.3
      - run: nix build .#default --print-build-logs
  release-config:
    # Checks the goreleaser config and builds the release archives and the
    # Cask into dist/ without publishing, so a broken release config fails
    # before release day.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # goreleaser's --parallelism. Without it a 4-core runner gets 1.
      STAVE_NUM_PROCESSORS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          # The next version comes from the commits since the last tag.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The same goreleaser version the Nix dev shell gives local runs.
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true
      - run: goreleaser check
      - run: go tool stave snapshot
  docs:
    # Builds the docs site with broken links set to fail, and checks every
    # shell block in the README and the docs parses in the shells it is
    # written for.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The same Node major and Bun version the Nix dev shell gives local runs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: sudo apt-get update && sudo apt-get install -y fish
      - run: scripts/check-doc-shell_test.sh
      - run: git ls-files -z 'website/docs/*.md' 'website/docs/*.mdx' | xargs -0 scripts/check-doc-shell.sh README.md
      - run: bun install --frozen-lockfile
        working-directory: website
      - run: bun run typecheck
        working-directory: website
      - run: bun run build
        working-directory: website
