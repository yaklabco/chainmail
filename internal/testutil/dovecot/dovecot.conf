# Integration-test config for chainmail. Any user logs in with password "pw".
protocols = imap
listen = *
log_path = /dev/stderr
info_log_path = /dev/stderr

ssl = required
ssl_cert = </etc/dovecot/tls/cert.pem
ssl_key = </etc/dovecot/tls/key.pem
ssl_min_protocol = TLSv1.2
disable_plaintext_auth = yes
auth_mechanisms = plain login

mail_location = maildir:/tmp/mail/%u
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
mail_max_userip_connections = 50

passdb {
  driver = static
  args = password=pw
}

userdb {
  driver = static
  args = uid=1000 gid=1000 home=/tmp/mail/%u
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
}

service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
